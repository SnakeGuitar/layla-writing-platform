apiVersion: v1
kind: Secret
metadata:
  name: layla-secrets
  namespace: layla
type: Opaque
# stringData se escribe en texto plano; Kubernetes lo codifica en base64 automáticamente.
# Cambia los valores antes de aplicar en producción real.
stringData:
  # ── SQL Server ─────────────────────────────────────────────────────────────
  # La contraseña SA debe cumplir requisitos de complejidad de SQL Server
  # (mayúscula + minúscula + dígito + símbolo, mínimo 8 caracteres)
  sql-sa-password: "CHANGE_ME"
  sql-connection-string: "Server=sqlserver,1433;Database=layla_db;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;"

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo-root-username: "admin"
  mongo-root-password: "CHANGE_ME"
  mongo-connection-string: "mongodb://admin:CHANGE_ME@mongodb:27017/layla_worldbuilding?authSource=admin"

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j-auth: "neo4j/CHANGE_ME"
  neo4j-username: "neo4j"
  neo4j-password: "CHANGE_ME"

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbit-user: "layla_user"
  rabbit-password: "CHANGE_ME"
  rabbitmq-url: "amqp://layla_user:CHANGE_ME@rabbitmq:5672"

  # ── JWT ────────────────────────────────────────────────────────────────────
  jwt-secret: "CHANGE_ME"
  jwt-refresh-secret: "CHANGE_ME"
  jwt-issuer: "LaylaSystem"
  jwt-audience: "LaylaClients"
  jwt-expiry-minutes: "1440"
  jwt-refresh-expiry: "10080"

  # ── Email (reemplaza con datos reales si quieres envío de correos) ──────────
  email-host: "smtp.gmail.com"
  email-port: "587"
  email-username: "CHANGE_ME"
  email-password: "CHANGE_ME"
  email-from-name: "Layla System"
  email-from-email: "CHANGE_ME"
